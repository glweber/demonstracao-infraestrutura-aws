# Application and container pipeline.
#
# Every third-party action is pinned to a full commit SHA. A tag is mutable and can
# be repointed by its owner at arbitrary code, which would execute inside this
# workflow with its permissions; a SHA cannot.
#
# No artefact is published anywhere. The image is built, exercised, scanned and
# discarded inside the runner. The job that would push it to Amazon ECR is present
# and complete, but stays dormant until an AWS role is configured for the
# repository.
---
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# The default token is read-only; each job widens it only where it must.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref, except on the default
# branch where every commit is verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: demonstration-service:ci

jobs:
  application:
    name: application (python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The lower bound is the version declared in requires-python. The upper bound
        # is the version the runtime image actually ships, so the code is never
        # shipped on an interpreter no job has run it on. The release between them is
        # covered so that an incompatibility is attributable to one version.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Install the application
        run: python -m pip install --editable './app[dev]'

      - name: Lint
        working-directory: app
        run: ruff check --output-format=github .

      - name: Check formatting
        working-directory: app
        run: ruff format --check .

      - name: Type-check
        working-directory: app
        run: mypy

      - name: Test
        working-directory: app
        run: pytest

  container:
    name: container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: application

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations are deliberately absent here. They are emitted as a
          # manifest list, which the docker exporter that "load: true" relies on
          # cannot export. The image is loaded so that it can be run and scanned in
          # the following steps, so loading wins; the publish job below, which
          # exports to a registry, attaches both attestations.

      - name: Confirm the image serves traffic under the cluster's constraints
        run: scripts/container-smoke.sh "${IMAGE}"

      # The image is exported to an archive so that the scanner reads it from a
      # file. Trivy runs from its published image rather than from an installer
      # script, and reaches neither the Docker socket nor the daemon, so the
      # scanning step holds no privilege over the host.
      - name: Export the image for scanning
        run: docker save "${IMAGE}" --output image.tar

      - name: Scan the image for known vulnerabilities
        run: |
          docker run --rm \
            --volume "${PWD}:/workspace" \
            --workdir /workspace \
            aquasec/trivy:0.74.0 image \
              --input image.tar \
              --format table \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1

      - name: Generate the software bill of materials
        run: |
          docker run --rm \
            --volume "${PWD}:/workspace" \
            --workdir /workspace \
            aquasec/trivy:0.74.0 image \
              --input image.tar \
              --format cyclonedx \
              --output sbom.cyclonedx.json

      - name: Retain the bill of materials as a build artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 30

  publish:
    name: publish to amazon ecr
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: container

    # Dormant by design. This repository publishes nothing: the variable is never
    # set, so the job is skipped on every run. It is written out in full so that the
    # federation path can be reviewed, and so that enabling it is a matter of
    # configuration rather than of writing new code.
    if: ${{ github.ref_type == 'tag' && vars.AWS_ROLE_ARN != '' }}

    permissions:
      contents: read
      # Required to mint the OIDC token exchanged for AWS credentials. No long-lived
      # access key is stored in this repository.
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume the deployment role through OIDC federation
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ci-${{ github.run_id }}
          # Credentials expire with the job rather than persisting on the runner.
          role-duration-seconds: 900

      - name: Build and push the release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.ref_name }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}
          sbom: true
          provenance: mode=max
