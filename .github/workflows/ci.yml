# Application and container pipeline.
#
# Every third-party action is pinned to a full commit SHA. A tag is mutable and can
# be repointed by its owner at arbitrary code, which would execute inside this
# workflow with its permissions; a SHA cannot.
#
# No artefact is published anywhere. The image is built, exercised, scanned and
# discarded inside the runner. The job that would push it to Amazon ECR is present
# and complete, but stays dormant until an AWS role is configured for the
# repository.
---
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# The default token is read-only; each job widens it only where it must.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref, except on the default
# branch where every commit is verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: demonstration-service:ci

jobs:
  application:
    name: application (python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The lower bound is the version declared in requires-python; the upper
        # bound is the next release, so an incompatibility surfaces before it is
        # forced by a base image upgrade.
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Install the application
        run: python -m pip install --editable './app[dev]'

      - name: Lint
        working-directory: app
        run: ruff check --output-format=github .

      - name: Check formatting
        working-directory: app
        run: ruff format --check .

      - name: Type-check
        working-directory: app
        run: mypy

      - name: Test
        working-directory: app
        run: pytest

  container:
    name: container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: application

    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build the image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A software bill of materials and build provenance are attached to the
          # image so that its contents can be audited without unpacking it.
          sbom: true
          provenance: mode=max

      - name: Confirm the image serves traffic under the cluster's constraints
        run: scripts/container-smoke.sh "${IMAGE}"

      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          # Findings without a published fix are reported but do not block the
          # build, since no action is available to the team that would clear them.
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate the software bill of materials
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom.cyclonedx.json

      - name: Retain the bill of materials as a build artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 30

  publish:
    name: publish to amazon ecr
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: container

    # Dormant by design. This repository publishes nothing: the variable is never
    # set, so the job is skipped on every run. It is written out in full so that the
    # federation path can be reviewed, and so that enabling it is a matter of
    # configuration rather than of writing new code.
    if: ${{ github.ref_type == 'tag' && vars.AWS_ROLE_ARN != '' }}

    permissions:
      contents: read
      # Required to mint the OIDC token exchanged for AWS credentials. No long-lived
      # access key is stored in this repository.
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Assume the deployment role through OIDC federation
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ci-${{ github.run_id }}
          # Credentials expire with the job rather than persisting on the runner.
          role-duration-seconds: 900

      - name: Build and push the release image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.ref_name }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}
          sbom: true
          provenance: mode=max
