# Kubernetes pipeline.
#
# The manifests are not merely rendered and linted: they are applied to a real
# Kubernetes cluster created on the runner, the rollout is awaited, and the running
# workload is exercised through its Service. A manifest that renders but cannot
# schedule, pass admission or become ready fails here rather than in an environment
# that matters.
---
name: kubernetes

on:
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - "docker/**"
      - "app/**"
      - "scripts/**"
      - ".github/workflows/kubernetes.yml"
  pull_request:
    branches: [main]
    paths:
      - "k8s/**"
      - "docker/**"
      - "app/**"
      - "scripts/**"
      - ".github/workflows/kubernetes.yml"

permissions:
  contents: read

concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: demonstration-service:local
  CLUSTER_NAME: demonstration
  NAMESPACE: demonstration

jobs:
  manifests:
    name: manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubeconform
        run: |
          set -euo pipefail
          version=v0.7.0
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Render and validate every overlay
        run: |
          set -euo pipefail
          for overlay in k8s/overlays/*; do
            echo "==> ${overlay}"
            kubectl kustomize "${overlay}" \
              | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0
          done

  cluster:
    name: cluster
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: manifests

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: |
          docker build \
            --file docker/Dockerfile \
            --tag "${IMAGE}" \
            --build-arg APP_VERSION=0.0.0-ci \
            --build-arg COMMIT_SHA="${GITHUB_SHA}" \
            .

      # kind is installed directly rather than through an action so that the CLI
      # version matches the node image pinned in k8s/kind-cluster.yaml. A mismatch
      # between the two breaks image side-loading, and it also means this job runs
      # the same script a developer runs locally, with no CI-only path.
      - name: Install kind
        run: |
          set -euo pipefail
          version=v0.30.0
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${version}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Create the cluster and deploy the development overlay
        run: scripts/kind-up.sh

      - name: Verify the running workload
        run: scripts/smoke-test.sh

      # Diagnostics are collected only on failure, where they are the difference
      # between a reproducible report and a rerun.
      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n "${NAMESPACE}" get all -o wide || true
          kubectl -n "${NAMESPACE}" describe pods || true
          kubectl -n "${NAMESPACE}" logs -l app.kubernetes.io/name=demonstration-service --all-containers --tail=200 || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -50 || true
