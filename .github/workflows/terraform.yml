# Infrastructure as code pipeline.
#
# No stage in this workflow contacts AWS. Formatting, validation and linting are
# static, and the unit tests run against a mocked provider, so the entire
# configuration is verified without credentials, without state and without cost.
#
# `terraform plan` is deliberately absent: it requires credentials and a state
# backend, and would prove only that the configuration matches an account this
# repository does not have. The mocked tests assert the module's behaviour instead,
# which is the property that actually needs guarding.
---
name: terraform

on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TERRAFORM_VERSION: 1.15.9

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff terraform

  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        directory:
          - terraform/modules/network
          - terraform/modules/eks
          - terraform/modules/ecr
          - terraform/modules/irsa
          - terraform/modules/observability
          - terraform/envs/dev
          - terraform/envs/prod

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # No backend is initialised, so no state is read and no credentials are
      # required. Only the provider plugins are downloaded.
      - name: Initialise without a backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate -no-color

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: Install the ruleset
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: tflint --recursive --format compact --minimum-failure-severity=warning

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      # Required to upload the SARIF report to the code scanning dashboard.
      security-events: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan the configuration
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: terraform
          framework: terraform
          quiet: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      - name: Retain the findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkov-sarif-${{ github.sha }}
          path: checkov.sarif
          retention-days: 30
          if-no-files-found: ignore

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        module:
          - terraform/modules/network
          - terraform/modules/eks
          - terraform/modules/ecr
          - terraform/modules/irsa
          - terraform/modules/observability
          # The environments are root modules with composition tests of their own,
          # asserting the trade-offs each one selects.
          - terraform/envs/dev
          - terraform/envs/prod

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialise without a backend
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false -input=false

      # The provider is mocked inside the test files, so these runs make no API
      # call and consume no credentials.
      - name: Run the module unit tests
        working-directory: ${{ matrix.module }}
        run: terraform test -no-color
