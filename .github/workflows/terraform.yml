# Infrastructure as code pipeline.
#
# No stage in this workflow contacts AWS. Formatting, validation and linting are
# static, and the unit tests run against a mocked provider, so the entire
# configuration is verified without credentials, without state and without cost.
#
# `terraform plan` is deliberately absent: it requires credentials and a state
# backend, and would prove only that the configuration matches an account this
# repository does not have. The mocked tests assert the module's behaviour instead,
# which is the property that actually needs guarding.
---
name: terraform

on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TERRAFORM_VERSION: 1.15.9

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff terraform

  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        directory:
          - terraform/modules/network
          - terraform/modules/eks
          - terraform/modules/ecr
          - terraform/modules/irsa
          - terraform/modules/observability
          - terraform/envs/dev
          - terraform/envs/prod

    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # No backend is initialised, so no state is read and no credentials are
      # required. Only the provider plugins are downloaded.
      - name: Initialise without a backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate -no-color

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: Install the ruleset
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: tflint --recursive --format compact --minimum-failure-severity=warning

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      # Required to upload the SARIF report to the code scanning dashboard.
      security-events: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Scan the configuration
        uses: bridgecrewio/checkov-action@38a95e98d734de90b74687a0fc94cfb4dcc9c169 # v12.3040.0
        with:
          directory: terraform
          framework: terraform
          quiet: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      - name: Retain the findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkov-sarif-${{ github.sha }}
          path: checkov.sarif
          retention-days: 30
          if-no-files-found: ignore

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        module:
          - terraform/modules/network
          - terraform/modules/eks
          - terraform/modules/ecr
          - terraform/modules/irsa
          - terraform/modules/observability

    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialise without a backend
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false -input=false

      # The provider is mocked inside the test files, so these runs make no API
      # call and consume no credentials.
      - name: Run the module unit tests
        working-directory: ${{ matrix.module }}
        run: terraform test -no-color
