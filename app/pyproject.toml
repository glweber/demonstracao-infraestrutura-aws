# Packaging and tooling configuration — PEP 621.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "demonstration-service"
version = "1.0.0"
description = "Reference HTTP workload used to exercise the container and cluster configuration"
readme = "README.md"
# The floor, not the target: the runtime image ships 3.14, and continuous
# integration runs the suite on every version between the two.
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Guilherme Weber" }]
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "httpx2==2.13.1",
  "mypy==2.4.0",
  "ruff==0.16.10",
  "pyyaml==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Rule families: pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade,
# pep8-naming, pydocstyle (PEP 257), security, and simplification.
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "ANN", "RUF"]
ignore = [
  "D203", # Incompatible with D211; D211 is the retained convention.
  "D213", # Incompatible with D212; D212 is the retained convention.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D103", "ANN201"] # Assertions and terse test names are idiomatic.

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gate is set at the level actually achieved. A threshold below it merely
# records how much regression is tolerated before anyone is told.
addopts = "--strict-markers --strict-config --cov=service --cov-report=term-missing --cov-fail-under=100"
filterwarnings = ["error"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# A line excluded from measurement is a line nobody is accountable for, so the
# exclusion list is limited to constructs that cannot execute at runtime.
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
