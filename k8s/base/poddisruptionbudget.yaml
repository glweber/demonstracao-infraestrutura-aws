---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demonstration-service
spec:
  # Bounds voluntary disruption: a node drain during an upgrade may remove one
  # replica at a time, never the whole deployment. Expressed as maxUnavailable so
  # that the guarantee holds however the replica count is later scaled.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demonstration-service
