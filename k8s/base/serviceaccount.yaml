---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demonstration-service
# The default token grants API access the workload does not need. Disabling the
# automatic mount removes that credential from the container filesystem entirely.
# It does not affect IRSA: the identity webhook projects a separate, audience-scoped
# token whenever the eks.amazonaws.com/role-arn annotation is present, which the
# production overlay adds.
automountServiceAccountToken: false
