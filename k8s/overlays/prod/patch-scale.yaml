# Production capacity. The floor of three keeps one replica per availability zone,
# so the loss of a zone removes a third of capacity rather than a third of the
# service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demonstration-service
spec:
  replicas: 3
  template:
    spec:
      # Zonal spread is a requirement rather than a preference here: a schedule that
      # cannot honour it should fail loudly instead of silently stacking replicas
      # into one zone.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: demonstration-service
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: demonstration-service
      containers:
        - name: service
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
